[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "maat-universal-casegraph"
version = "0.2.0"
description = "Agentic case reconstruction: messy context to executable graph and proof receipt"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.0.0",
  "strands-agents-tools>=0.2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "RUF"]
