services:
  - type: web
    name: maat-universal-casegraph
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -e '.[dev]' && ruff check src tests scripts && pytest -q && python scripts/preflight.py
    startCommand: uvicorn maat.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
